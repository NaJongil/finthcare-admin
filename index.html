<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>핀스케어 이용 현황 대시보드</title>
    <!-- 정적 파일명이 고정이라 Cloudflare가 4시간 캐시한다. JS·CSS를 바꾸면 v 값을 올려야
         새 HTML과 옛 JS가 섞여 화면이 통째로 죽는 일을 막는다. -->
    <link rel="stylesheet" href="/styles.css?v=20261115">
</head>
<body>

<!-- 로그인 -->
<div id="loginScreen" class="login">
    <div class="login-card">
        <!-- logo.svg를 받으면 이 줄을 <img src="/logo.svg" alt="핀스케어"> 로 교체 -->
        <div class="wordmark">FinthCare</div>

        <h1 class="login-title">이용 현황 대시보드</h1>
        <p class="login-subtitle">접속 코드를 입력해 이용 현황을 확인하세요</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="accessCode">접속 코드</label>
                <input type="text" id="accessCode" autocomplete="off" spellcheck="false"
                       placeholder="접속 코드를 입력하세요">
            </div>
            <button type="submit" id="loginBtn" class="btn-primary">접속하기</button>
        </form>

        <p id="loginError" class="form-error" hidden></p>

        <p class="login-help">
            접속 코드를 모르시나요?
            <a href="mailto:hello@finthcare.com">담당자에게 문의하기</a>
        </p>
    </div>
</div>

<!-- 대시보드 -->
<div id="dashboard" hidden>
    <header class="header">
        <div class="header-inner">
            <div class="wordmark">FinthCare</div>
            <div class="header-divider"></div>
            <span class="org-name" id="orgName"></span>
            <button type="button" class="btn-ghost" id="logoutBtn">로그아웃</button>
        </div>
    </header>

    <main class="main">
        <!-- 요약 -->
        <section class="summary" id="summary" aria-live="polite"></section>

        <!-- 명의예약 -->
        <section id="specialistSection">
            <h2 class="section-title">명의예약 내역</h2>
            <div id="specialistBody"></div>
        </section>

        <!-- 건강검진 : 데이터 없으면 섹션 자체를 감춘다 -->
        <section id="checkupSection" hidden>
            <h2 class="section-title">건강검진 내역</h2>
            <div id="checkupBody"></div>
        </section>

        <!-- 바로가기 : 후기·콘텐츠는 리포트에 싣지 않고 핀스케어 홈페이지로 보낸다 -->
        <nav class="link-banners" aria-label="핀스케어 바로가기">
            <a class="link-banner" href="https://www.finthcare.com/reviews" target="_blank" rel="noopener">
                <span class="link-banner-text">
                    <strong>핀스케어 고객 후기</strong>
                    <span>건강의 갈림길에서 핀스케어를 만난 분들의 목소리</span>
                </span>
                <span class="link-banner-arrow" aria-hidden="true">→</span>
            </a>
            <a class="link-banner" href="https://www.finthcare.com/blogs" target="_blank" rel="noopener">
                <span class="link-banner-text">
                    <strong>블로그 보러가기</strong>
                    <span>의료 가이드부터 비즈니스 성장을 위한 정보</span>
                </span>
                <span class="link-banner-arrow" aria-hidden="true">→</span>
            </a>
        </nav>
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span>문의 <a href="mailto:hello@finthcare.com">hello@finthcare.com</a></span>
            <span>이용 방법 안내는 담당 매니저에게 요청하세요.</span>
        </div>
    </footer>
</div>

<script src="/app.js?v=20261115" type="module"></script>
</body>
</html>
